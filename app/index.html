<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品总览 · Workflow Hub</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
/* ---------- header / filters ---------- */
.head-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.head-actions{display:flex;align-items:center;gap:.6rem}
.gear{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:1.15rem;line-height:1;padding:.45rem .55rem;border-radius:8px}
.gear:hover{color:var(--primary);border-color:var(--line);background:#fff}
.filters{display:flex;gap:1.5rem;flex-wrap:wrap;align-items:flex-start;margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--line)}
.fgroup{display:flex;flex-direction:column;gap:.35rem}
.fgroup .form-label{margin:0;font-size:.78rem}
.fgroup .chips{min-height:34px;align-items:center}
#search{width:240px;padding:.4rem .7rem;font-size:.9rem;height:34px}
#clearFilters{align-self:flex-end;margin-bottom:.5rem}

/* ---------- table ---------- */
.table-card{padding:.5rem .75rem 1rem}
table.hub{width:100%;border-collapse:collapse;font-size:.9rem;table-layout:fixed}
table.hub thead th{
  background:#f8fafc;color:var(--muted);font-weight:600;font-size:.78rem;text-align:left;
  padding:.6rem .5rem;border-bottom:2px solid var(--line);white-space:nowrap;
  position:sticky;top:0;z-index:2;
}
table.hub thead th.sortable{cursor:pointer;user-select:none}
table.hub thead th.sortable:hover{color:var(--primary)}
table.hub thead th .arrow{font-size:.6rem;opacity:.6;margin-left:.2rem}
table.hub td{padding:.4rem .5rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
table.hub tbody tr.row:hover td{background:#fafbff}
tr.grp td{background:#f8fafc;color:var(--primary);font-weight:600;font-size:.82rem;padding:.45rem .75rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tr.grp td .n{color:var(--muted);font-weight:400;margin-left:.35rem}
tr.grp.none td{color:var(--muted)}

.cell-in{width:100%;padding:.42rem .5rem;border:1px solid var(--line);border-radius:6px;font-size:.88rem;font-family:inherit;background:#fff;color:var(--dark)}
.cell-in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(79,70,229,.12)}
.cell-in.missing{border-color:var(--warn-line);background:var(--warn-bg)}
.cell-in.bad{border-color:var(--danger);background:var(--danger-bg)}
select.cell-in:disabled{background:#f8fafc;color:var(--dark);opacity:1;cursor:not-allowed}
.cell-in.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sub-asin{display:block;font-size:.7rem;color:#94a3b8;margin:.15rem 0 0 .15rem;font-variant-numeric:tabular-nums}

/* image */
.thumb{width:96px;height:96px;border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc;position:relative;
  display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.thumb span{font-size:.75rem;color:#94a3b8}
.thumb:hover,.thumb.over,.thumb:focus-visible{border-color:var(--primary);background:#eef2ff;outline:none}
.thumb.has{border-style:solid;border-color:var(--line);background:#fff;cursor:zoom-in}
.thumb.has.pick{cursor:pointer}
.thumb.over{box-shadow:0 0 0 2px var(--primary)}
.thumb.panning{cursor:grabbing;touch-action:none}
.thumb img{-webkit-user-drag:none;user-select:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .clear{position:absolute;top:3px;right:3px;width:18px;height:18px;border:none;border-radius:4px;
  background:rgba(15,23,42,.72);color:#fff;font-size:.7rem;line-height:1;cursor:pointer;opacity:0;padding:0}
.thumb:hover .clear{opacity:1}

/* draft row: not saved until it has an image and 品名 */
tr.row.draft td{background:#fcfcfd}
tr.row.draft td:first-child{box-shadow:inset 3px 0 0 #cbd5e1}
.draft-tag{display:block;font-size:.7rem;color:var(--warn-text);margin:.15rem 0 0 .15rem}
tr.row.draft .step,tr.row.draft .step:hover{color:#cbd5e1;border-color:#f1f5f9;background:#fff;font-weight:400;cursor:not-allowed}

/* status */
.st-sel{width:100%;border:1px solid transparent;border-radius:999px;padding:.3rem .55rem;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.st-sel:focus{outline:none;box-shadow:0 0 0 2px rgba(79,70,229,.2)}
.st0{background:var(--s0-bg);color:var(--s0-tx)}
.st1{background:var(--s1-bg);color:var(--s1-tx)}
.st2{background:var(--s2-bg);color:var(--s2-tx)}
.st3{background:var(--s3-bg);color:var(--s3-tx)}
.st-sel option{background:#fff;color:var(--dark);font-weight:400}

/* date */
.date-btn{width:100%;text-align:left;padding:.42rem .55rem;border:1px solid var(--line);border-radius:6px;background:#fff;
  font-family:inherit;font-size:.86rem;color:var(--dark);cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.date-btn:hover,.date-btn:focus-visible{border-color:var(--primary);outline:none}
.date-btn.empty{color:#94a3b8}

/* journey: 报价 — 下单 — 上架 */
.jr{display:flex;align-items:center}
.jr .ln{flex:0 0 12px;height:2px;background:var(--line)}
.jr .ln.on{background:var(--primary)}
.step{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:.18rem .6rem;
  font-family:inherit;font-size:.76rem;cursor:pointer;white-space:nowrap;transition:.15s}
.step:hover{border-color:var(--primary);color:var(--primary)}
.step.done{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:500}
.step.done:hover{background:var(--primary-dark)}
.step.next{border-color:var(--primary);color:var(--primary);background:#eef2ff;font-weight:600}
.step.locked{color:#cbd5e1;border-color:#f1f5f9;background:#fff}

.empty-box{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.9rem}
.empty-box b{display:block;color:var(--dark);font-size:1rem;margin-bottom:.3rem;font-weight:600}

/* expanded row: 报价 (Step 1). The panel sits over a spacer row so re-rendering the table never reloads the iframe. */
.table-card{position:relative}
tr.row.open td{background:#f8faff}
tr.row.open td:first-child{box-shadow:inset 3px 0 0 var(--primary)}
tr.row td.hit{cursor:pointer}
tr.xp-spacer td{padding:0;border-bottom:1px solid var(--line)}
.xp-panel{position:absolute;z-index:1;background:#f8faff;padding:.75rem .75rem .6rem;border-bottom:1px solid var(--line)}
.xp-panel iframe{display:block;width:100%;border:0;background:transparent}
.xp-foot{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:.6rem}
.xp-foot .hint{margin:0}
.btn-ok{background:var(--s3-bg);color:var(--s3-tx);border:1px solid #a7f3d0}
.btn-ok:hover{background:#d1fae5}

/* settings */
.set-sec + .set-sec{margin-top:1.4rem;padding-top:1.2rem;border-top:1px solid #f1f5f9}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem}
.set-sec .form-label .note{font-weight:400;color:#94a3b8;margin-left:.35rem}
#liveOffset{max-width:140px}

/* image viewer */
.iv-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:120;display:flex;align-items:center;justify-content:center;padding:4vh 3vw}
.iv{background:#fff;border-radius:var(--radius);box-shadow:0 20px 40px rgba(15,23,42,.3);width:100%;height:100%;max-width:1700px;display:flex;overflow:hidden}
.iv.over{box-shadow:0 0 0 3px var(--primary),0 20px 40px rgba(15,23,42,.3)}
.iv-stage{flex:1;min-width:0;position:relative;background:#fff}
.iv-img{position:absolute;inset:2rem 5.5rem;width:calc(100% - 11rem);height:calc(100% - 4rem);object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.iv-img.soft{filter:blur(1px);opacity:.85}
.iv-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:1px solid var(--line);border-radius:8px;background:#fff;
  color:var(--dark);font-size:1.6rem;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(15,23,42,.08);font-family:inherit}
.iv-nav:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.iv-nav:disabled{opacity:.35;cursor:default;box-shadow:none}
.iv-nav.prev{left:1.25rem}
.iv-nav.next{right:1.25rem}
.iv-side{flex:0 0 280px;border-left:1px solid var(--line);padding:1.4rem 1.25rem;overflow-y:auto;display:flex;flex-direction:column;gap:.7rem;position:relative}
.iv-close{position:absolute;top:.9rem;right:.9rem;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;
  color:var(--dark);font-size:1.2rem;line-height:1;cursor:pointer}
.iv-close:hover{border-color:var(--primary);color:var(--primary)}
.iv-title{font-weight:600;font-size:1rem;line-height:1.4;padding-right:2.6rem;word-break:break-word}
.iv-meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.7}
.iv-count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.iv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.iv-tile{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;background:#fff;padding:0}
.iv-tile img{width:100%;height:100%;object-fit:cover;display:block}
.iv-tile.on{border:2px solid var(--primary)}
.iv-tile .tag{position:absolute;left:3px;bottom:3px;font-size:.62rem;line-height:1.4;background:rgba(15,23,42,.72);color:#fff;border-radius:3px;padding:0 .3rem}
.iv-tile .del{position:absolute;top:3px;right:3px;width:18px;height:18px;border:none;border-radius:4px;background:rgba(15,23,42,.72);
  color:#fff;font-size:.7rem;line-height:1;cursor:pointer;opacity:0;padding:0}
.iv-tile:hover .del{opacity:1}
.iv-tile.add{border:1px dashed #cbd5e1;background:#f8fafc;color:#94a3b8;font-size:1.5rem;font-family:inherit;display:flex;align-items:center;justify-content:center}
.iv-tile.add:hover{border-color:var(--primary);color:var(--primary);background:#eef2ff}
.iv-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.iv-side .hint{margin:0}
.iv-frame{position:absolute;inset:0;margin:auto;overflow:hidden;background:#fff;border:1px solid var(--line);
  box-shadow:0 2px 10px rgba(15,23,42,.08);cursor:grab;touch-action:none;user-select:none}
.iv-frame.dragging{cursor:grabbing}
.iv-frame img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
</style>
</head>
<body>
<div class="container">

  <div class="card tight">
    <div class="head-row">
      <div>
        <h1>产品总览</h1>
        <div class="sub" id="countLine"></div>
      </div>
      <div class="head-actions">
        <button type="button" class="btn btn-primary" id="addBtn">+ 新建产品</button>
        <button type="button" class="gear" id="gearBtn" title="设置">⚙</button>
      </div>
    </div>
    <div class="filters">
      <div class="fgroup">
        <label class="form-label" for="search">搜索</label>
        <input type="text" id="search" class="form-control" placeholder="品名 / SKU / 父ASIN">
      </div>
      <div class="fgroup">
        <span class="form-label">状态</span>
        <div class="chips" id="statusChips"></div>
      </div>
      <div class="fgroup">
        <span class="form-label">类目</span>
        <div class="chips" id="catChips"></div>
      </div>
      <button type="button" class="menu-link hidden" id="clearFilters">清除筛选</button>
    </div>
  </div>

  <div class="card table-card">
    <table class="hub">
      <colgroup>
        <col style="width:112px"><col><col style="width:104px"><col style="width:170px">
        <col style="width:112px"><col style="width:132px"><col style="width:236px"><col style="width:44px">
      </colgroup>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyBox" class="empty-box hidden"></div>
    <!-- 报价：展开行面板 -->
    <div class="xp-panel hidden" id="xpPanel">
      <iframe id="xpFrame" title="报价" style="height:420px"></iframe>
      <div class="xp-foot">
        <span class="hint">参数（运费 / 汇率 / 毛利率 / 旺季）在
          <button type="button" class="menu-link" data-act="quote-settings">⚙ 设置 → 报价</button>
          中统一修改，所有产品实时生效。</span>
        <button type="button" class="btn btn-primary btn-sm" id="confirmBtn">✓ 确认价格</button>
      </div>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="modal-back hidden" id="setModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="modal-head">
      <h2 id="setTitle">设置</h2>
      <button type="button" class="del-btn" id="setClose" title="关闭">×</button>
    </div>
    <div class="tabs">
      <button type="button" class="tab active" data-tab="general">通用</button>
      <button type="button" class="tab" data-tab="quote">报价</button>
      <button type="button" class="tab" disabled title="后续阶段">下单</button>
      <button type="button" class="tab" disabled title="后续阶段">上架</button>
    </div>
    <div class="modal-body hidden" data-body="quote">
      <div class="set-grid">
        <div><label class="form-label">头程运费价格 (￥/kg)</label><input type="number" step="any" class="form-control" data-p="shippingPrice"></div>
        <div><label class="form-label">美元对人民币汇率</label><input type="number" step="any" class="form-control" data-p="exchangeRate"></div>
        <div><label class="form-label">毛利率 (%)</label><input type="number" step="any" class="form-control" data-p="profitMargin"></div>
        <div><label class="form-label">入库配置费 ($)</label><input type="number" step="any" class="form-control" data-p="storageFee"></div>
        <div>
          <label class="form-label">是否旺季</label>
          <div class="toggle-group" id="peakToggle">
            <button type="button" class="toggle-btn" data-peak="0">非旺季</button>
            <button type="button" class="toggle-btn" data-peak="1">旺季</button>
          </div>
        </div>
      </div>
      <div class="hint" style="margin-top:1rem">修改后所有产品的售价立即按新参数重算。
        <button type="button" class="menu-link" id="p1Reset">恢复默认值</button></div>
    </div>
    <div class="modal-body" data-body="general">
      <div class="set-sec">
        <span class="form-label">类目<span class="note">同时作为 SKU 前缀（XK → XK_）</span></span>
        <div class="tag-wrap" id="catList"></div>
        <div class="inline-add">
          <input type="text" id="catNew" class="form-control" maxlength="3" placeholder="新增类目，2–3 个字母，例 VS">
          <button type="button" class="btn btn-ghost btn-sm" id="catAdd">添加</button>
        </div>
      </div>
      <div class="set-sec">
        <label class="form-label" for="liveOffset">上架预估天数</label>
        <input type="number" id="liveOffset" class="form-control" min="0" step="1">
        <div class="hint">选择上架时间时，日历会打开在「交货日期 + N 天」所在的月份。</div>
      </div>
    </div>
  </div>
</div>

<!-- 图片查看 -->
<div class="iv-back hidden" id="ivBack">
  <div class="iv" id="iv" role="dialog" aria-modal="true" aria-labelledby="ivTitle">
    <div class="iv-stage" id="ivStage">
      <img class="iv-img" id="ivImg" alt="">
      <div class="iv-frame hidden" id="ivFrame" title="按住拖动调整位置，Ctrl+滚轮缩放"><img id="ivFrameImg" alt="" draggable="false"></div>
      <button type="button" class="iv-nav prev" id="ivPrev" title="上一张">‹</button>
      <button type="button" class="iv-nav next" id="ivNext" title="下一张">›</button>
    </div>
    <div class="iv-side">
      <button type="button" class="iv-close" id="ivClose" title="关闭（Esc）">×</button>
      <div class="iv-title" id="ivTitle"></div>
      <div class="iv-meta" id="ivMeta"></div>
      <div class="iv-count" id="ivCount"></div>
      <div class="iv-grid" id="ivGrid"></div>
      <div class="iv-actions" id="ivActions">
        <button type="button" class="btn btn-ghost btn-sm" id="ivReplace" title="用新图片替换主图">替换主图</button>
        <button type="button" class="btn btn-ghost btn-sm" id="ivReset" title="恢复为居中、铺满方框">重置位置</button>
      </div>
      <div class="hint" id="ivFrameHint">主图方框 = 表格缩略图：按住拖动调整位置，Ctrl + 滚轮缩放（可缩小到显示整张图），自动保存。</div>
      <div class="hint" id="ivHint">粘贴或拖入图片即可添加，每个产品最多 6 张。</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="shared/api.js"></script>
<script src="shared/sku.js"></script>
<script src="shared/rows.js"></script>
<script src="shared/datepicker.js"></script>
<script src="shared/embed.js"></script>
<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IMG_STORE_MAX = 1400;       // same as Step 2: longest side kept for the full image
const THUMB_SIZE = 320;           // meta.thumb is a THUMB_SIZE square, cropped by meta.thumbCrop
const IMG_LIMIT = 6;              // images per row: the main one + 5 more (viewer only)

let settings = null;
let rows = [];
const ui = { q: '', statuses: [], cats: [], sort: { key: 'liveDate', dir: 1 } };
const justAdded = new Set();      // new rows stay visible whatever the filters, until reload
const drafts = new Set();         // new rows that aren't saved yet: they need an image and 品名
const draftImg = new Map();       // draft id → full image, written to step2.json once the draft is saved
const imgCount = r => r.imgCount != null ? r.imgCount : (r.thumb ? 1 : 0);

/* ============ toast ============ */
let toastTimer = null;
function toast(msg, warn){
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('warn', !!warn);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), warn ? 4200 : 2600);
}
api.onError = err => toast(err.offline ? err.message : '保存失败：' + err.message, true);

/* ============ saving ============ */
const saveTimers = {};
function saveRow(r){
  if (drafts.has(r.id)) return commitDraft(r);
  clearTimeout(saveTimers[r.id]);
  saveTimers[r.id] = setTimeout(() => {
    delete saveTimers[r.id];
    api.saveRow(r).catch(() => {});
  }, 300);
}
window.addEventListener('pagehide', () => {
  Object.keys(saveTimers).forEach(id => {
    clearTimeout(saveTimers[id]);
    const r = byId(id);
    if (r) api.saveRowBeacon(r);
  });
});
/* a draft is written for the first time once it has both an image and 品名 */
function commitDraft(r){
  if (!r.name.trim() || !draftImg.has(r.id)) return;
  const full = draftImg.get(r.id);
  drafts.delete(r.id);
  draftImg.delete(r.id);
  api.saveRow(r)
    .then(() => updateStep2Image(r, full))
    .then(() => toast('已保存「' + r.name + '」'))
    .catch(() => {});
}
function saveSettings(){ return api.saveSettings(settings).catch(() => {}); }
const byId = id => rows.find(r => r.id === id);

/* ============ render ============ */
function visibleRows(){ return ROWS.filterRows(rows, ui, justAdded); }

function render(){
  const focus = captureFocus();
  renderChips();
  renderHead();
  renderBody();
  restoreFocus(focus);
}
/* re-render after the current event settles (e.g. after Tab has moved focus) */
let renderQueued = false;
function renderSoon(){
  if (renderQueued) return;
  renderQueued = true;
  setTimeout(() => { renderQueued = false; render(); }, 0);
}

function captureFocus(){
  const a = document.activeElement;
  if (!a || !a.dataset || !a.dataset.id || !a.dataset.f) return null;
  return { id: a.dataset.id, f: a.dataset.f,
           start: typeof a.selectionStart === 'number' ? a.selectionStart : null,
           end: typeof a.selectionEnd === 'number' ? a.selectionEnd : null };
}
function restoreFocus(f){
  if (!f) return;
  const el = $('tbody').querySelector('[data-id="' + f.id + '"][data-f="' + f.f + '"]');
  if (!el) return;
  el.focus();
  if (f.start != null && el.setSelectionRange) try { el.setSelectionRange(f.start, f.end); } catch (e) {}
}

function renderChips(){
  const count = (key, v) => rows.filter(r => r[key] === v).length;
  $('statusChips').innerHTML = ROWS.STATUSES.map(s =>
    '<button type="button" class="chip' + (ui.statuses.includes(s) ? ' active' : '') + '" data-status="' + esc(s) + '">' +
    esc(s) + '<span class="n">' + count('status', s) + '</span></button>').join('');
  $('catChips').innerHTML = settings.categories.map(c =>
    '<button type="button" class="chip' + (ui.cats.includes(c) ? ' active' : '') + '" data-cat="' + esc(c) + '">' +
    esc(c) + '<span class="n">' + count('category', c) + '</span></button>').join('');
  const filtering = ui.q.trim() || ui.statuses.length || ui.cats.length;
  $('clearFilters').classList.toggle('hidden', !filtering);
  const shown = visibleRows().length;
  $('countLine').textContent = '共 ' + rows.length + ' 个产品' + (filtering ? ' · 显示 ' + shown + ' 个' : '');
}

function renderHead(){

const STEP_TIPS = {

$('tbody').addEventListener('change', e => {

  switch (el.dataset.f) {

function commitSku(r, el){
  const raw = el.value.trim();
  if (!raw) {
    el.classList.remove('bad');
    if (r.sku) { r.sku = ''; saveRow(r); renderSoon(); }
    return;
  }
  const p = SKU.parse(raw);
  if (!p) {
    el.classList.add('bad');
    toast('SKU 格式应为 XK_012-023 或 XK_406', true);
    return;
  }
  el.classList.remove('bad');
  if (!settings.categories.includes(p.cat)) {
    if (!confirm('类目「' + p.cat + '」不存在，添加为新类目？')) {
      el.value = r.sku;
      return;
    }
    settings.categories.push(p.cat);
    saveSettings();
  }
  const clash = rows.find(o => o.id !== r.id && SKU.overlaps(p, SKU.parse(o.sku)));
  r.sku = SKU.format(p);
  r.category = p.cat;
  el.value = r.sku;
  saveRow(r);
  renderSoon();
  if (clash) toast('注意：与「' + (clash.name || '未命名') + '」(' + clash.sku + ') 的 SKU 范围重叠', true);
}

$('tbody').addEventListener('keydown', e => {

  if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
  if (e.key === 'Escape') {
    const r = byId(el.dataset.id);
    if (r) { el.value = el.dataset.f === 'sku' ? r.sku : r.name; el.classList.remove('bad'); el.blur(); }
  }
});

document.addEventListener('click', e => {

function openDate(r, btn){

    onClear: () => { r.liveDate = ''; saveRow(r); render(); }

/* 交货日期 + N days, as 'YYYY-MM-DD'; '' when there is no delivery date yet */
function estimateLiveDate(r){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(r.deliveryDate || '')) return '';
  const d = new Date(r.deliveryDate + 'T00:00:00');
  d.setDate(d.getDate() + (+settings.liveOffsetDays || 0));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

async function deleteRow(r){
  if (drafts.has(r.id)) {                       // never saved: just drop it
    drafts.delete(r.id); draftImg.delete(r.id); justAdded.delete(r.id);
    rows = rows.filter(x => x !== r);

  }

  clearTimeout(saveTimers[r.id]);
  delete saveTimers[r.id];

}

$('addBtn').addEventListener('click', () => {

/* ============ images ============ */
/* main image: step2.json products[0] (shared with Step 2) · up to 5 more: images.json (viewer only)
   meta keeps imgCount and a THUMB_SIZE square thumb cut by thumbCrop
   {x, y: fractions of the width / height, s: side as a fraction of the short edge} */
const step2Path = r => 'rows/' + r.id + '/step2.json';
const imagesPath = r => 'rows/' + r.id + '/images.json';

function pickImage(cb, multiple){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = !!multiple;
  inp.onchange = () => { if (inp.files.length) cb(multiple ? [...inp.files] : inp.files[0]); };
  inp.click();
}
function drawScaled(img, max, quality){
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
  cx.drawImage(img, 0, 0, w, h);
  return { url: cv.toDataURL('image/jpeg', quality), w, h };
}
function loadImg(url){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('图片读取失败'));
    img.src = url;
  });
}
function readFile(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error('图片读取失败'));
    fr.readAsDataURL(file);
  });
}
/* the largest centred square */
function centerCrop(w, h){
  const m = Math.min(w, h);
  return { x: (w - m) / 2 / w, y: (h - m) / 2 / h, s: 1 };
}
function makeThumb(img, c){
  const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  const k = THUMB_SIZE / (c.s * Math.min(W, H));      // frame → canvas; white where the image doesn't reach
  const cv = document.createElement('canvas'); cv.width = cv.height = THUMB_SIZE;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, THUMB_SIZE, THUMB_SIZE);
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(img, -c.x * W * k, -c.y * H * k, W * k, H * k);
  return cv.toDataURL('image/jpeg', 0.8);
}
/* file → {full:{url,w,h}, thumb, crop} ; full matches Step 2's loadImageData (1400px, JPEG 0.85) */
async function processImage(file){
  const img = await loadImg(await readFile(file));
  const crop = centerCrop(img.width, img.height);
  return { full: drawScaled(img, IMG_STORE_MAX, 0.85), thumb: makeThumb(img, crop), crop };
}
/* the full image lives in step2.json products[0] (shared with Step 2); meta keeps only the thumb */
async function updateStep2Image(r, full){
  const path = step2Path(r);
  let s2 = await api.get(path);
  if (!s2 || typeof s2 !== 'object') s2 = {};
  if (!Array.isArray(s2.products)) s2.products = [];
  if (!s2.products.length) {
    if (!full) return;
    s2.products.push({ id: Math.random().toString(36).slice(2, 10), code: '', productName: r.name,
      material: '', plant: '不含', image: null, imgNat: null, frame: null, variants: [] });
  }
  const p = s2.products[0];
  p.image = full ? full.url : null;
  p.imgNat = full ? { w: full.w, h: full.h } : null;
  p.frame = full ? { w: full.w, h: full.h } : null;
  await api.put(path, s2);
}

/* row id → [main, ...extras] as {url,w,h}; loaded when the viewer opens, kept in step with every write */
const imgCache = new Map();
async function loadRowImages(r){
  if (imgCache.has(r.id)) return imgCache.get(r.id);
  const [s2, im] = await Promise.all([api.get(step2Path(r)), api.get(imagesPath(r))]);
  const p = s2 && Array.isArray(s2.products) ? s2.products[0] : null;
  const list = [];
  if (p && p.image) list.push({ url: p.image, w: (p.imgNat && p.imgNat.w) || 0, h: (p.imgNat && p.imgNat.h) || 0 });
  ((im && Array.isArray(im.extra)) ? im.extra : []).forEach(x => { if (x && x.url) list.push(x); });
  imgCache.set(r.id, list);
  return list;
}
const saveExtras = (r, list) => api.put(imagesPath(r), { extra: list.slice(1) });

/* replace the main image (row thumb click / paste / drop, or 替换主图 in the viewer) */
async function setRowImage(r, file){
  if (!file || !/^image\//.test(file.type)) return toast('请选择图片文件', true);
  try {
    const d = await processImage(file);
    if (!byId(r.id)) return;
    r.thumb = d.thumb; r.thumbCrop = d.crop; r.imgCount = Math.max(1, imgCount(r));
    if (drafts.has(r.id)) {
      draftImg.set(r.id, d.full);
      saveRow(r); render();                               // saves the draft if 品名 is already filled
      if (drafts.has(r.id)) toast('填写品名后自动保存');
      return;
    }
    saveRow(r); render();
    await updateStep2Image(r, d.full);
    const c = imgCache.get(r.id);
    if (c) { if (c.length) c[0] = d.full; else c.push(d.full); }
    viewerChanged(r);
    toast('图片已保存');
  } catch (e) {
    if (!e.offline) toast(e.message, true);
  }
}
/* the main image goes and the next one becomes main; a row always keeps at least one image */
async function deleteMainImage(r){
  try {
    const list = await loadRowImages(r);
    if (list.length < 2) return toast('每个产品至少保留一张图片', true);
    const next = list[1];
    const img = await loadImg(next.url);
    next.w = next.w || img.naturalWidth; next.h = next.h || img.naturalHeight;
    await updateStep2Image(r, next);
    list.splice(0, 1);
    await saveExtras(r, list);
    r.thumbCrop = centerCrop(img.naturalWidth, img.naturalHeight);
    r.thumb = makeThumb(img, r.thumbCrop);
    r.imgCount = list.length;
    saveRow(r); render();
    viewerChanged(r);
    toast('已删除主图');
  } catch (e) {
    imgCache.delete(r.id);
    if (!e.offline) toast(e.message, true);
  }
}
/* rows saved before the square thumbs: rebuild a sharp centred thumb from the full image */
async function upgradeThumb(r, main){
  try {
    const img = await loadImg(main.url);
    r.thumbCrop = centerCrop(img.naturalWidth, img.naturalHeight);
    r.thumb = makeThumb(img, r.thumbCrop);
    saveRow(r); render();
  } catch (e) {}
}
/* a saved row with an image opens the viewer; otherwise pick a file */
function thumbClick(r){
  if (r.thumb && !drafts.has(r.id)) openViewer(r);
  else pickImage(f => setRowImage(r, f));
}

let hoverThumb = null;
document.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('.thumb');
  const id = t ? t.dataset.id : null;
  if (id && id !== hoverThumb) {                       // preload the full image for drag / Ctrl+wheel
    const r = byId(id);
    if (r && r.thumb) openFrame(r).catch(() => {});
  }
  hoverThumb = id;
});
document.addEventListener('paste', e => {
  const files = [...((e.clipboardData || {}).items || [])]
    .filter(it => it.type.indexOf('image/') === 0).map(it => it.getAsFile()).filter(Boolean);
  if (viewer) {                                         // the viewer is open: paste adds an image
    if (files.length) { e.preventDefault(); viewerAdd(files); }
    return;
  }
  const a = document.activeElement;
  const id = hoverThumb || (a && a.classList && a.classList.contains('thumb') ? a.dataset.id : null);
  const r = id && byId(id);
  if (!r || !files.length) return;
  e.preventDefault();
  setRowImage(r, files[0]);
});
document.addEventListener('dragover', e => {
  e.preventDefault();                                   // never let a stray drop navigate away
  if (viewer) return $('iv').classList.add('over');
  const t = e.target.closest && e.target.closest('.thumb');
  document.querySelectorAll('.thumb.over').forEach(x => { if (x !== t) x.classList.remove('over'); });
  if (t) t.classList.add('over');
});
document.addEventListener('dragleave', e => {
  if (viewer && !e.relatedTarget) $('iv').classList.remove('over');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  if (viewer) {                                         // the viewer is open: drop adds images
    $('iv').classList.remove('over');
    const files = [...(e.dataTransfer.files || [])];
    if (files.length) viewerAdd(files);
    return;
  }
  const t = e.target.closest && e.target.closest('.thumb');
  document.querySelectorAll('.thumb.over').forEach(x => x.classList.remove('over'));
  if (!t) return;
  const f = (e.dataTransfer.files || [])[0];
  const r = byId(t.dataset.id);
  if (r && f) setRowImage(r, f);
});
$('tbody').addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList.contains('thumb') && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    const r = byId(t.dataset.id);
    if (r) thumbClick(r);
  }
});

/* ============ reposition: the frame stays still, the image moves inside it (as in collage-app) ============ */
/* thumbCrop = the frame as a window onto the full image: {x, y} its top-left as fractions of the image's
   width / height, s its side as a fraction of the short edge. s < 1 zooms in; s up to long / short edge
   zooms out until the whole image fits (white padding), so nothing is ever lost — the full image is never changed */
const CROP_MIN = 0.1;                                   // 10× zoom
function clampCrop(c, W, H){
  const m = Math.min(W, H);
  c.s = Math.min(Math.max(W, H) / m, Math.max(CROP_MIN, c.s));
  const side = c.s * m;
  /* frame inside the image when the image is bigger; image inside the frame when it's smaller */
  const fit = (v, len) => Math.min(Math.max(0, len - side), Math.max(Math.min(0, len - side), v));
  c.x = fit(c.x * W, W) / W;
  c.y = fit(c.y * H, H) / H;
  return c;
}
const cropFor = (r, W, H) => clampCrop(Object.assign({}, r.thumbCrop || centerCrop(W, H)), W, H);
/* drag by (dx, dy) frame widths: the image follows the pointer */
function panCrop(c, W, H, dx, dy){
  const side = c.s * Math.min(W, H);
  c.x -= dx * side / W;
  c.y -= dy * side / H;
  return clampCrop(c, W, H);
}
/* zoom by k (> 1 = in) keeping the image point under (fx, fy) — frame fractions — still */
function zoomCrop(c, W, H, k, fx, fy){
  const m = Math.min(W, H), side = c.s * m;
  const px = c.x * W + fx * side, py = c.y * H + fy * side;
  c.s /= k;
  clampCrop(c, W, H);
  c.x = (px - fx * c.s * m) / W;
  c.y = (py - fy * c.s * m) / H;
  return clampCrop(c, W, H);
}
const wheelFactor = e => Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.013 : 0.0004));   // ≈ 4% per wheel notch
/* place the full image inside a square frame of `size` px */
function layoutFrame(im, size, f, c){
  if (im.getAttribute('src') !== f.main.url) im.src = f.main.url;
  const k = size / (c.s * Math.min(f.W, f.H)), s = im.style;
  s.position = 'absolute'; s.maxWidth = 'none'; s.objectFit = 'fill';
  s.width = f.W * k + 'px'; s.height = f.H * k + 'px';
  s.left = -c.x * f.W * k + 'px'; s.top = -c.y * f.H * k + 'px';
}
/* the decoded main image of a row → {main, img, W, H}; null when the row has none.
   A draft's image isn't saved yet: it comes from draftImg */
const decoded = new WeakMap();
async function openFrame(r){
  const main = drafts.has(r.id) ? draftImg.get(r.id) : (await loadRowImages(r))[0];
  if (!main) return null;
  if (!decoded.has(main)) decoded.set(main, loadImg(main.url));
  const img = await decoded.get(main);
  return { main, img, W: img.naturalWidth, H: img.naturalHeight };
}
/* save a new position: rebuild the 320 thumb from the full image; false when nothing changed */
function commitCrop(r, f, c){
  const rd = v => Math.round(v * 1e4) / 1e4, o = r.thumbCrop;
  const n = { x: rd(c.x), y: rd(c.y), s: rd(c.s) };
  if (o && o.x === n.x && o.y === n.y && o.s === n.s) return false;
  r.thumbCrop = n;
  r.thumb = makeThumb(f.img, n);
  saveRow(r);
  return true;
}

/* ---- row thumb (saved rows and drafts): press + drag moves the image, Ctrl + wheel zooms;
   a click without moving opens the viewer (a draft: the file picker) ---- */
let tg = null;              // {r, el, x0, y0, dx, dy, moved, f, c0, c}
let skipThumbClick = false;
function thumbPan(g){
  if (!g.f) return;
  const size = g.el.clientWidth;
  g.c = panCrop(Object.assign({}, g.c0), g.f.W, g.f.H, g.dx / size, g.dy / size);
  layoutFrame(g.el.querySelector('img'), size, g.f, g.c);
}
$('tbody').addEventListener('pointerdown', e => {
  const t = e.target.closest('.thumb.has');
  if (!t || e.button !== 0 || e.target.closest('.clear')) return;
  const r = byId(t.dataset.id);
  if (!r) return;
  const g = tg = { r, el: t, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: false, f: null };
  t.setPointerCapture(e.pointerId);
  openFrame(r).then(f => {
    if (tg !== g || !f) return;
    g.f = f; g.c0 = cropFor(r, f.W, f.H);
    if (g.moved) thumbPan(g);
  }).catch(() => {});
});
$('tbody').addEventListener('pointermove', e => {
  const g = tg;
  if (!g) return;
  g.dx = e.clientX - g.x0; g.dy = e.clientY - g.y0;
  if (!g.moved && Math.abs(g.dx) + Math.abs(g.dy) < 4) return;
  g.moved = true;
  g.el.classList.add('panning');
  thumbPan(g);
});
['pointerup', 'pointercancel'].forEach(type => $('tbody').addEventListener(type, () => {
  const g = tg;
  if (!g) return;
  tg = null;
  if (!g.moved) return;                                 // a plain click: the click handler takes it
  skipThumbClick = true;
  setTimeout(() => { skipThumbClick = false; }, 0);
  if (g.c) commitCrop(g.r, g.f, g.c);
  render();
}));

let wz = null;              // Ctrl + wheel on a row thumb: {r, f, c, q: pending [k, fx, fy], timer}
$('tbody').addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  const t = e.target.closest('.thumb.has');
  const r = t && byId(t.dataset.id);
  if (!r) return;
  e.preventDefault();                                   // no browser zoom
  if (wz && wz.r !== r) wheelEnd();
  if (!wz) {
    const z = wz = { r, f: null, c: null, q: [] };
    openFrame(r).then(f => {
      if (wz !== z) return;
      if (!f) { wz = null; return; }
      z.f = f; z.c = cropFor(r, f.W, f.H);
      wheelFlush();
    }).catch(() => { if (wz === z) wz = null; });
  }
  const b = t.getBoundingClientRect(), size = t.clientWidth;
  wz.q.push([wheelFactor(e), (e.clientX - b.left - t.clientLeft) / size, (e.clientY - b.top - t.clientTop) / size]);
  wheelFlush();
  clearTimeout(wz.timer);
  wz.timer = setTimeout(wheelEnd, 400);                 // save once the wheel goes quiet
}, { passive: false });
function wheelFlush(){
  if (!wz || !wz.f) return;
  const { f } = wz;
  wz.q.splice(0).forEach(([k, fx, fy]) => zoomCrop(wz.c, f.W, f.H, k, fx, fy));
  const t = $('tbody').querySelector('.thumb[data-id="' + wz.r.id + '"]');
  if (t) layoutFrame(t.querySelector('img'), t.clientWidth, f, wz.c);
}
function wheelEnd(){
  const z = wz;
  wz = null;
  if (!z) return;
  clearTimeout(z.timer);
  if (z.f && z.c) commitCrop(z.r, z.f, z.c);
  render();
}

/* ============ image viewer ============ */
/* {id, idx, list: null while loading | [{url,w,h}], ver, f: main image frame | null, c: its crop, drag, saveTimer} */
let viewer = null;
let viewerBusy = false;     // one add / delete at a time
let gridKey = '';

/* ← → order = the table's visible order (groups + sort); saved rows with an image only */
function viewerOrder(){
  return ROWS.groupRows(visibleRows(), settings.categories, ui.sort)
    .reduce((a, g) => a.concat(g.rows), [])
    .filter(r => r.thumb && !drafts.has(r.id));
}

function openViewer(r){
  viewerSaveNow();
  viewer = { id: r.id, idx: 0, list: null, ver: 0, f: null, c: null, drag: null, saveTimer: null };
  $('ivBack').classList.remove('hidden');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  renderViewer();
  loadRowImages(r).catch(() => []).then(list => {
    if (!viewer || viewer.id !== r.id) return;
    viewer.list = list;
    if (list.length && r.imgCount !== list.length) { r.imgCount = list.length; saveRow(r); render(); }
    renderViewer();
    if (list.length && !r.thumbCrop) upgradeThumb(r, list[0]);
  });
}
function closeViewer(){
  if (!viewer) return;
  viewerSaveNow();
  const id = viewer.id;
  viewer = null; gridKey = '';
  $('ivBack').classList.add('hidden');
  $('iv').classList.remove('over');
  $('ivImg').removeAttribute('src');
  $('ivFrameImg').removeAttribute('src');
  const tr = $('tbody').querySelector('tr[data-row="' + id + '"]');
  if (tr) tr.scrollIntoView({ block: 'nearest' });
}
/* after a write to row r's images: redraw if the viewer shows r */
function viewerChanged(r){
  if (!viewer || viewer.id !== r.id) return;
  viewer.list = imgCache.get(r.id) || viewer.list;
  viewer.idx = Math.max(0, Math.min(viewer.idx, (viewer.list || []).length - 1));
  if (viewer.f && (!viewer.list || viewer.f.main !== viewer.list[0])) viewer.f = null;   // the main image changed
  viewer.ver++;
  renderViewer();
}

function renderViewer(){
  if (!viewer) return;
  const r = byId(viewer.id);
  if (!r) return closeViewer();
  const list = viewer.list, cur = list && list[viewer.idx];
  const onMain = !!(cur && viewer.idx === 0);
  const order = viewerOrder(), pos = order.indexOf(r);
  const ids = [r.sku, r.parentAsin].filter(Boolean).map(esc).join(' · ');
  $('ivTitle').textContent = r.name || '未命名';
  $('ivMeta').innerHTML = ids + (pos > -1 ? (ids ? '<br>' : '') + '产品 ' + (pos + 1) + ' / ' + order.length + ' · 按 ← → 切换' : '');
  $('ivCount').textContent = !list ? '加载中…' : list.length ? '图片 ' + (viewer.idx + 1) + ' / ' + list.length : '没有找到原图';
  $('ivPrev').disabled = !list || viewer.idx <= 0;
  $('ivNext').disabled = !list || viewer.idx >= list.length - 1;

  /* main image: the square frame (what the table shows); other images: whole */
  $('ivFrame').classList.toggle('hidden', !onMain);
  $('ivImg').classList.toggle('hidden', onMain);
  if (onMain) {
    layoutViewerFrame();
    if (!viewer.f) {
      const want = cur;
      openFrame(r).then(f => {
        if (!viewer || viewer.id !== r.id || !f || f.main !== want || viewer.f) return;
        viewer.f = f; viewer.c = cropFor(r, f.W, f.H);
        layoutViewerFrame();
      }).catch(() => {});
    }
  } else {
    const img = $('ivImg'), src = cur ? cur.url : r.thumb;
    if (img.getAttribute('src') !== src) img.src = src;
    img.classList.toggle('soft', !cur);
  }

  const key = viewer.id + '#' + viewer.ver + '#' + (list ? list.length : -1);
  if (key !== gridKey) {                                // rebuild only when the images change
    gridKey = key;
    $('ivGrid').innerHTML = !list ? '' : list.map((x, i) =>
      '<div class="iv-tile" data-iv="pick" data-i="' + i + '" title="' + (i ? '图片 ' + (i + 1) : '主图（表格中显示）') + '">' +
        '<img src="' + (i ? x.url : r.thumb) + '" alt="" draggable="false">' + (i ? '' : '<span class="tag">主图</span>') +
        (list.length > 1 ? '<button type="button" class="del" data-iv="del" data-i="' + i + '" title="删除这张图片">×</button>' : '') +
      '</div>').join('') +
      (list.length < IMG_LIMIT ? '<button type="button" class="iv-tile add" data-iv="add" title="添加图片（可多选，最多 ' + IMG_LIMIT + ' 张）">+</button>' : '');
  }
  $('ivGrid').querySelectorAll('.iv-tile[data-i]').forEach(t => t.classList.toggle('on', +t.dataset.i === viewer.idx));
  $('ivActions').classList.toggle('hidden', !list || !list.length);
  $('ivReset').classList.toggle('hidden', !onMain);
  $('ivFrameHint').classList.toggle('hidden', !onMain);
}
/* size the square to the stage and place the image in it (the thumb stands in while the full image loads) */
function layoutViewerFrame(){
  if (!viewer) return;
  const st = $('ivStage'), fr = $('ivFrame'), im = $('ivFrameImg'), r = byId(viewer.id);
  const size = Math.max(120, Math.floor(Math.min(st.clientWidth - 176, st.clientHeight - 64)));
  fr.style.width = fr.style.height = size + 'px';
  if (viewer.f) layoutFrame(im, fr.clientWidth, viewer.f, viewer.c);
  else if (r) { im.style.cssText = ''; if (im.getAttribute('src') !== r.thumb) im.src = r.thumb; }
}
window.addEventListener('resize', layoutViewerFrame);

/* save the viewer's position: table thumb and the 主图 tile follow at once */
function viewerSave(){
  if (!viewer) return;
  clearTimeout(viewer.saveTimer);
  viewer.saveTimer = null;
  const r = byId(viewer.id);
  if (!r || !viewer.f || !commitCrop(r, viewer.f, viewer.c)) return;
  render();
  const tile = $('ivGrid').querySelector('.iv-tile[data-i="0"] img');
  if (tile) tile.src = r.thumb;
}
function viewerSaveNow(){ if (viewer && viewer.saveTimer) viewerSave(); }

$('ivFrame').addEventListener('pointerdown', e => {
  if (!viewer || !viewer.f || e.button !== 0) return;
  e.preventDefault();
  $('ivFrame').setPointerCapture(e.pointerId);
  $('ivFrame').classList.add('dragging');
  viewer.drag = { x0: e.clientX, y0: e.clientY, c0: Object.assign({}, viewer.c) };
});
$('ivFrame').addEventListener('pointermove', e => {
  const d = viewer && viewer.drag;
  if (!d || !viewer.f) return;
  const size = $('ivFrame').clientWidth;
  viewer.c = panCrop(Object.assign({}, d.c0), viewer.f.W, viewer.f.H, (e.clientX - d.x0) / size, (e.clientY - d.y0) / size);
  layoutFrame($('ivFrameImg'), size, viewer.f, viewer.c);
});
['pointerup', 'pointercancel'].forEach(type => $('ivFrame').addEventListener(type, () => {
  $('ivFrame').classList.remove('dragging');
  if (!viewer || !viewer.drag) return;
  viewer.drag = null;
  viewerSave();
}));
/* Ctrl + wheel anywhere in the viewer: zoom the main image around the pointer; never the browser page */
$('ivBack').addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  if (!viewer || !viewer.f || $('ivFrame').classList.contains('hidden')) return;
  const fr = $('ivFrame'), b = fr.getBoundingClientRect(), size = fr.clientWidth;
  const at = v => Math.min(1, Math.max(0, v));
  zoomCrop(viewer.c, viewer.f.W, viewer.f.H, wheelFactor(e),
    at((e.clientX - b.left - fr.clientLeft) / size), at((e.clientY - b.top - fr.clientTop) / size));
  layoutFrame($('ivFrameImg'), size, viewer.f, viewer.c);
  clearTimeout(viewer.saveTimer);
  viewer.saveTimer = setTimeout(viewerSave, 300);
}, { passive: false });
$('ivReset').addEventListener('click', () => {
  if (!viewer || !viewer.f) return;
  viewer.c = centerCrop(viewer.f.W, viewer.f.H);
  layoutViewerFrame();
  viewerSave();
});

/* < > : images within the row · ← → : rows */
function viewerStep(d){
  if (!viewer || !viewer.list) return;
  const i = viewer.idx + d;
  if (i < 0 || i >= viewer.list.length) return;
  viewer.idx = i;
  renderViewer();
}
function viewerRow(d){
  if (!viewer) return;
  const order = viewerOrder();
  const i = order.findIndex(x => x.id === viewer.id);
  const n = i > -1 ? order[i + d] : null;
  if (n) openViewer(n);
}

async function viewerAdd(files){
  const r = viewer && byId(viewer.id), list = viewer && viewer.list;
  if (!r || !list) return;
  if (viewerBusy) return toast('正在处理上一张图片…');
  const imgs = files.filter(f => f && /^image\//.test(f.type));
  if (!imgs.length) return toast('请选择图片文件', true);
  const room = IMG_LIMIT - list.length;
  if (room <= 0) return toast('每个产品最多 ' + IMG_LIMIT + ' 张图片', true);
  const take = imgs.slice(0, room);
  viewerBusy = true;
  try {
    for (const f of take) {
      const d = await processImage(f);
      if (!list.length) {                               // no main image yet: this one becomes main
        await updateStep2Image(r, d.full);
        r.thumb = d.thumb; r.thumbCrop = d.crop;
      }
      list.push(d.full);
    }
    await saveExtras(r, list);
    r.imgCount = list.length;
    saveRow(r); render();
    if (viewer && viewer.id === r.id) { viewer.idx = list.length - 1; viewerChanged(r); }
    toast(imgs.length > room
      ? '已添加 ' + take.length + ' 张；每个产品最多 ' + IMG_LIMIT + ' 张，其余 ' + (imgs.length - room) + ' 张未添加'
      : '已添加 ' + take.length + ' 张图片', imgs.length > room);
  } catch (e) {
    imgCache.delete(r.id);
    if (!e.offline) toast(e.message, true);
  } finally {
    viewerBusy = false;
  }
}
async function viewerDelete(i){
  const r = viewer && byId(viewer.id), list = viewer && viewer.list;
  if (!r || !list || list.length < 2 || viewerBusy) return;
  if (!confirm(i ? '删除这张图片？' : '删除主图？下一张图片将成为主图。')) return;
  viewerBusy = true;
  try {
    if (i === 0) { viewer.idx = 0; return await deleteMainImage(r); }   // show the new main image
    list.splice(i, 1);
    await saveExtras(r, list);
    r.imgCount = list.length;
    saveRow(r); render();
    viewer.idx = Math.min(i, list.length - 1);
    viewerChanged(r);
    toast('已删除图片');
  } catch (e) {
    imgCache.delete(r.id);
  } finally {
    viewerBusy = false;
  }
}

$('ivGrid').addEventListener('click', e => {
  const t = e.target.closest('[data-iv]');
  if (!t || !viewer) return;
  if (t.dataset.iv === 'del') viewerDelete(+t.dataset.i);
  else if (t.dataset.iv === 'pick') { viewer.idx = +t.dataset.i; renderViewer(); }
  else if (t.dataset.iv === 'add') pickImage(files => viewerAdd(files), true);
});

$('ivNext').addEventListener('click', () => viewerStep(1));

$('ivReplace').addEventListener('click', () => {

function openSettings(tab){
  renderSettings();
  showTab(tab || 'general');
  $('setModal').classList.remove('hidden');
}
function closeSettings(){ $('setModal').classList.add('hidden'); render(); }
function renderSettings(){
  $('catList').innerHTML = settings.categories.map((c, i) =>
    '<span class="tag">' + esc(c) + '<button type="button" data-i="' + i + '" title="删除类目">×</button></span>').join('') ||
    '<span class="hint" style="margin:0">暂无类目，请在下方添加。</span>';
  $('liveOffset').value = settings.liveOffsetDays;
  document.querySelectorAll('[data-p]').forEach(el => { el.value = settings.step1[el.dataset.p]; });

  const c = settings.categories[+b.dataset.i];

});
$('liveOffset').addEventListener('change', e => {
  const n = Math.max(0, Math.round(+e.target.value || 0));
  e.target.value = n;
  settings.liveOffsetDays = n;
  saveSettings();
});

/* ============ start ============ */
(async function init(){
  try {
    settings = await api.settings();
    rows = (await api.rows()).map(ROWS.normalize);
  } catch (e) {
    $('emptyBox').innerHTML = '<b>未连接到本地服务</b>请双击项目文件夹中的 启动.bat 打开本页面。';
    $('emptyBox').classList.remove('hidden');
    return;
  }
  render();
  /* ?expand=<id> (from the workspace's 报价 step): open that row's 报价 panel */
  const want = new URLSearchParams(location.search).get('expand');
  const r = want && byId(want);
  if (r) toggleExpand(r);
})();
})();
</script>
</body>
</html>
